name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
# The workflow passes the version (from gradle/libs.versions.toml) explicitly; the resolver is not used.
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'library'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '⬆️ Dependencies'
    labels:
      - 'dependencies'
      - 'dependency'
  - title: '🧰 Maintenance'
    labels:
      - 'maintenance'
      - 'ci'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&@' # You can add # and @ to disable mentions, and add ` to disable code blocks.
template: |
  ## Changes

  $CHANGES
