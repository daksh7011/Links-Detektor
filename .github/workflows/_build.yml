# Reusable Linux build + verify chain. Called by ci / develop / master. Not triggered on its own.
name: Build & Verify (Linux)

on:
  workflow_call:

jobs:
  build:
    name: Detekt and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Kotlin version bump invalidates it.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      # `check` runs the jvm, android host, js/wasm node and linuxX64 tests plus checkKotlinAbi.
      - name: Detekt, tests and ABI check
        run: ./gradlew detektCheck :links-detektor:check --continue
      # The showcase app: desktop and web tests, then the production web bundle and its size budget.
      # ubuntu-latest ships Chrome for the Karma wasm tests.
      - name: App tests and web distribution
        run: >-
          ./gradlew jvmTest :webApp:wasmJsBrowserTest
          :shared:design-library:wasmJsBrowserTest :shared:presentation:wasmJsBrowserTest
          :feature:common:client:api:wasmJsBrowserTest :feature:common:client:metro:wasmJsBrowserTest
          :feature:detektor:client:api:wasmJsBrowserTest :feature:detektor:client:basic:wasmJsBrowserTest
          :webApp:wasmJsBrowserDistribution :desktopApp:compileKotlin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Size script tests
        run: node --test scripts/wasm-size.test.mjs
      - name: Web payload budget
        run: node scripts/wasm-size.mjs webApp/build/dist/wasmJs/productionExecutable --budget-mb 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: links-detektor-web
          path: webApp/build/dist/wasmJs/productionExecutable
          retention-days: 7
          if-no-files-found: error
