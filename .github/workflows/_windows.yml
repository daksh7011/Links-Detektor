# Reusable Windows build chain (mingwX64 tests). Called by ci / develop / master. Not triggered on its own.
name: Build & Verify (Windows)

on:
  workflow_call:

jobs:
  windows:
    name: mingwX64 tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: mingwX64 tests
        shell: bash
        run: ./gradlew :links-detektor:mingwX64Test --continue
