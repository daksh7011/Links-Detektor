name: Build (CI)

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Labeler
        uses: actions/labeler@v5.0.0

  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml

  apple:
    permissions:
      contents: read
    uses: ./.github/workflows/_apple.yml

  windows:
    permissions:
      contents: read
    uses: ./.github/workflows/_windows.yml
