name: Build Master & Publish

on:
  push:
    branches:
      - master

# Releases on Maven Central are immutable: never run two publishes at once, never cancel one half way.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml

  apple:
    permissions:
      contents: read
    uses: ./.github/workflows/_apple.yml

  windows:
    permissions:
      contents: read
    uses: ./.github/workflows/_windows.yml

  publish:
    name: Release, publish and deploy docs
    needs: [build, apple, windows]
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write

    # All Kotlin/Native targets (Apple included) publish from one macOS host.
    runs-on: macos-latest

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      released: ${{ steps.resolve.outputs.released }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle (Setup)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-submit

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # The version is the `lib` entry of the catalog: 3.0.0-alphaN, -betaN, -rcN, then 3.0.0. Release Drafter's own
      # resolver cannot produce that format, so it is only given the result. Releases on Maven Central are immutable,
      # so publishing and the GitHub release are skipped when the version already exists there.
      - name: Resolve version
        id: resolve
        run: |
          VERSION=$(grep -m1 '^lib = ' gradle/libs.versions.toml | cut -d'"' -f2)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]+)?$' || { echo "::error::Bad version $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$VERSION" in *-*) echo "PRERELEASE=true" ;; *) echo "PRERELEASE=false" ;; esac >> "$GITHUB_ENV"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://repo1.maven.org/maven2/com/slothiesmooth/links-detektor/$VERSION/")
          [ "$CODE" = "200" ] && echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV" || echo "ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          [ "$CODE" = "200" ] && echo "released=false" >> "$GITHUB_OUTPUT" || echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Test and check ABI
        run: ./gradlew :links-detektor:allTests :links-detektor:checkKotlinAbi

      - name: Release to Maven central
        if: env.ALREADY_PUBLISHED == 'false'
        run: ./gradlew :links-detektor:publishAllPublicationsToMavenCentralRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      # A tag and a published release exist for every version that reaches Maven Central. alpha, beta and rc
      # versions are marked as pre-releases.
      - name: Release Drafter
        id: release_drafter
        if: env.ALREADY_PUBLISHED == 'false'
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          version: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          publish: true
          commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate API docs
        run: ./gradlew :links-detektor:dokkaGenerate

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: links-detektor/build/dokka/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Only when this run released a new version (same gate as Maven Central and Release Drafter), stable or pre-release.
  # There is no manual trigger: it would re-run the publish. To redeploy by hand, run `npm run deploy` in deploy/web.
  web:
    name: Deploy web app and attach zip
    needs: publish
    if: needs.publish.outputs.released == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle (Setup)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/web/package-lock.json

      - name: Build web distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Check payload budget
        run: node scripts/wasm-size.mjs webApp/build/dist/wasmJs/productionExecutable --budget-mb 5

      - name: Package
        run: |
          cd webApp/build/dist/wasmJs/productionExecutable
          zip -r "$GITHUB_WORKSPACE/links-detektor-web-$VERSION.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum "links-detektor-web-$VERSION.zip" > "links-detektor-web-$VERSION.zip.sha256"

      - name: Attach to the GitHub release
        run: gh release upload "$VERSION" "links-detektor-web-$VERSION.zip" "links-detektor-web-$VERSION.zip.sha256" --clobber

      - name: Deploy Worker
        working-directory: deploy/web
        run: npm ci && npx wrangler deploy | tee "$RUNNER_TEMP/deploy.log"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The public technowolf.in URL is not recorded as working yet, so check the workers.dev URL wrangler printed.
      - name: Smoke check
        run: |
          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          [ -n "$URL" ] || { echo "::error::No workers.dev URL in the deploy output"; exit 1; }
          curl -fsS -o /dev/null "$URL/links-detektor/"
